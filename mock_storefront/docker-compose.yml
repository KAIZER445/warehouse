services:
    store_db:
        image: postgres:17
        container_name: store_db
        ports:
            - "5433:5432"
        volumes:
            - store_db:/var/lib/postgresql/data/
        environment:
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}

volumes:
    store_db:
